{% extends "admin/submit_line.html" %}

{% block submit-row %}
  {% if show_save %}
    <div class="festival-save-actions" role="group" aria-label="Сохранение фестиваля"{% if festival_is_draft %} aria-describedby="festival-save-hint"{% endif %}>
      <button type="submit" name="_save" value="1" class="festival-action-button{% if not festival_is_draft %} festival-action-button--primary{% endif %}">{% if festival_is_draft %}Сохранить черновик{% else %}Сохранить изменения{% endif %}</button>
      {% if can_publish_festival %}
        <button type="submit" name="_publish" value="1" class="festival-action-button festival-action-button--primary">Сохранить и опубликовать</button>
      {% endif %}
    </div>
    {% if festival_is_draft %}
      <p id="festival-save-hint" class="festival-save-hint">Черновик не публикуется на сайте.</p>
    {% endif %}
  {% else %}
    {{ block.super }}
  {% endif %}
{% endblock %}
