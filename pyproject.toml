[tool.pytest.ini_options]
minversion = "9.1"
DJANGO_SETTINGS_MODULE = "ri_fest.settings_test"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-config --strict-markers --import-mode=importlib"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.djlint]
profile = "django"
custom_blocks = "component"
indent = 4
max_line_length = 100
format_css = true
format_js = true
